<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0a0a" />
    <title>TraderApe — 404 Off the Board</title>
    <!--
      Static 404 fallback for TraderApe. Vercel rewrites route unknown paths
      to the SPA's branded NotFoundPage; this file covers the edge where the
      SPA never boots (e.g. a stale chunk after a redeploy). No auto-redirect —
      like the in-app 404, it's a dead-end in the jungle, not a silent bounce home.
    -->
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0a0a0a;
        color: #f1ece1;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        text-align: center;
        padding: 2rem;
      }
      .ape { font-size: clamp(64px, 12vw, 120px); line-height: 1; margin-bottom: 1.5rem; }
      h1 {
        margin: 0 0 1.25rem;
        font-size: clamp(32px, 6vw, 64px);
        text-transform: uppercase;
        letter-spacing: -0.025em;
        color: #f1ece1;
      }
      p {
        margin: 0 auto 2rem;
        max-width: 46ch;
        line-height: 1.5;
        color: #f1ece1;
      }
      a {
        display: inline-block;
        font-size: 0.8rem;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        padding: 0.7rem 1.15rem;
        border: 2px solid #d6ff2e;
        color: #0a0a0a;
        background: #d6ff2e;
        box-shadow: 4px 4px 0 #f1ece1;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="ape" aria-hidden="true">🦍</div>
      <h1>404 — Off the Board</h1>
      <p>That route went undrafted. No league, no trade, nothing but jungle back here.</p>
      <a href="/">Back to TraderApe</a>
    </main>
  </body>
</html>
